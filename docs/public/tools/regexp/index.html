<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正则表达式速查 · jkit 在线工具</title>
  <meta name="description" content="本地浏览器内调试正则表达式：实时高亮匹配、捕获组与位置；93 条覆盖验证、提取、替换、表单、HTML、浏览器 UA 的常用正则，含 JavaScript/Python/PHP/Java 写法。" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <img src="/logo.svg" alt="jkit" class="brand-logo" />
      <span class="brand-name">jkit</span>
      <span class="brand-sep">/</span>
      <span class="brand-tool" data-i18n="brandTool">正则表达式速查</span>
    </a>
    <div class="top-actions">
      <a class="ghost-link" href="/">← <span data-i18n="backHome">返回文档</span></a>
      <a class="ghost-link" href="https://github.com/zhengmingliang/jkit" target="_blank" rel="noopener">GitHub</a>
      <button id="langBtn" class="icon-btn" type="button" title="Switch language">EN</button>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    <!-- ============ 调试器 ============ -->
    <section class="card" id="debugger">
      <div class="card-head">
        <h1 data-i18n="debuggerTitle">正则表达式调试</h1>
      </div>

      <div class="form-row">
        <select id="presetSelect" class="select" aria-label="preset">
          <option value="" data-i18n="presetPlaceholder">自定义 / 选择常用正则</option>
        </select>
      </div>

      <div class="form-row pattern-row">
        <span class="slash">/</span>
        <input id="patternInput" class="input pattern-input" type="text" spellcheck="false"
          data-i18n-ph="patternPh" placeholder="请输入正则表达式，如：^\d{3}-\d{8}$" autocomplete="off" />
        <span class="slash">/</span>
        <input id="flagsInput" class="input flags-input" type="text" spellcheck="false" value="g"
          maxlength="6" autocomplete="off" aria-label="flags" />
      </div>

      <div class="flags-row">
        <button type="button" class="flag-chip" data-flag="g" title="g">g</button>
        <button type="button" class="flag-chip" data-flag="i" title="i">i</button>
        <button type="button" class="flag-chip" data-flag="m" title="m">m</button>
        <button type="button" class="flag-chip" data-flag="s" title="s">s</button>
        <button type="button" class="flag-chip" data-flag="u" title="u">u</button>
        <button type="button" class="flag-chip" data-flag="y" title="y">y</button>
        <span id="flagHint" class="flag-hint"></span>
      </div>

      <textarea id="testInput" class="textarea" rows="5" spellcheck="false"
        data-i18n-ph="testTextPh" placeholder="请输入要测试的文本"></textarea>

      <div id="errorMsg" class="error-msg" role="alert" hidden></div>
      <div id="statusMsg" class="status-msg"></div>

      <pre id="highlightView" class="highlight-view" hidden><code></code></pre>
      <div id="matchList" class="match-list"></div>
    </section>

    <!-- ============ 常用正则库 ============ -->
    <section class="card library">
      <div class="card-head">
        <h1 data-i18n="libraryTitle">常用正则速查库</h1>
      </div>
      <p class="card-desc" id="libraryDesc"></p>
      <div class="search-wrap">
        <input id="searchInput" class="input" type="text" spellcheck="false"
          data-i18n-ph="searchPh" placeholder="搜索名称、说明或正则内容…" autocomplete="off" />
      </div>
      <div id="searchCount" class="search-count"></div>
      <div id="libraryContainer"></div>
      <div id="emptySearch" class="empty-tip" hidden data-i18n="emptySearch">没有匹配的常用正则</div>
    </section>

    <!-- ============ 语法速查 ============ -->
    <section class="card">
      <div class="card-head">
        <h1 data-i18n="syntaxTitle">语法速查</h1>
      </div>
      <div id="syntaxContainer"></div>
    </section>

    <footer class="foot">
      <p data-i18n="footPrivacy">🔒 所有匹配均在本地浏览器中完成，测试文本不会上传到任何服务器。</p>
      <p>
        <span data-i18n="footCredit1">功能与常用正则数据对标 FeHelper「正则表达式工具」</span>
        （<a href="https://github.com/zxlie/FeHelper" target="_blank" rel="noopener">MIT</a>）。
      </p>
    </footer>
  </main>

  <!-- ============ 多语言写法弹窗 ============ -->
  <div id="modalMask" class="modal-mask" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button id="modalClose" class="modal-close" type="button" aria-label="close">×</button>
      <h2 id="modalTitle" class="modal-title"></h2>
      <p id="modalDesc" class="modal-desc"></p>
      <div id="modalCodes"></div>
      <div class="modal-actions">
        <button id="loadBtn" class="btn btn-primary" type="button" data-i18n="loadToDebugger">↓ 填入调试器</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
