<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel/CSV 转 JSON · jkit 在线工具</title>
  <meta name="description" content="本地浏览器内把 Excel（.xlsx/.xls）/ CSV / TSV 转成 JSON 或 SQL Insert，文件不上传。" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <img src="/logo.svg" alt="jkit" class="brand-logo" />
      <span class="brand-name">jkit</span>
      <span class="brand-sep">/</span>
      <span class="brand-tool" data-i18n="brandTool">Excel/CSV 转 JSON</span>
    </a>
    <div class="top-actions">
      <a class="ghost-link" href="/">← <span data-i18n="backHome">返回文档</span></a>
      <a class="ghost-link" href="https://github.com/zhengmingliang/jkit" target="_blank" rel="noopener">GitHub</a>
      <button id="langBtn" class="icon-btn" type="button" title="Switch language">EN</button>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="card toolbar">
      <div class="toolbar-row">
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden />
        <button id="fileBtn" class="btn" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5-5 5 5"/><path d="M12 5v12"/></svg>
          <span data-i18n="pickFile">选择 Excel/CSV 文件</span>
        </button>
        <select id="sheetSelect" class="sheet-select" hidden aria-label="worksheet"></select>
        <span class="toolbar-sep"></span>
        <span class="muted" data-i18n="examples">示例：</span>
        <button class="btn-link" type="button" data-example="simple" data-i18n="exSimple">简单表格</button>
        <button class="btn-link" type="button" data-example="user" data-i18n="exUser">用户信息</button>
        <button class="btn-link" type="button" data-example="score" data-i18n="exScore">成绩单</button>
      </div>
      <div class="toolbar-row toolbar-row-bottom">
        <label class="table-name">
          <span data-i18n="tableName">SQL 表名</span>
          <input id="tableName" type="text" value="my_table" spellcheck="false" />
        </label>
        <span id="statusMsg" class="status-msg"></span>
        <span id="errorMsg" class="error-msg" role="alert"></span>
      </div>
    </section>

    <section class="panes">
      <div class="card pane">
        <div class="pane-head">
          <h2 data-i18n="inputTitle">输入（CSV / TSV / 单列文本，首行为表头）</h2>
          <button id="clearBtn" class="btn-link" type="button" data-i18n="clear">清空</button>
        </div>
        <textarea id="pasteInput" class="pane-textarea" spellcheck="false"
          data-i18n-ph="inputPh" placeholder="可直接粘贴表格内容：支持 CSV（逗号分隔）、TSV（Tab 分隔，可从 Excel 直接粘贴）或单列多行文本"></textarea>
      </div>

      <div class="card pane">
        <div class="pane-head">
          <h2 data-i18n="outputTitle">输出结果</h2>
          <div class="pane-actions">
            <button id="convertBtn" class="btn btn-primary" type="button">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
              <span data-i18n="toJson">转换为 JSON</span>
            </button>
            <button id="sqlBtn" class="btn btn-warn" type="button">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
              <span data-i18n="toSql">转换为 SQL Insert</span>
            </button>
            <button id="copyBtn" class="btn" type="button" data-i18n="copy">复制</button>
            <button id="downloadBtn" class="btn" type="button" data-i18n="download">下载</button>
          </div>
        </div>
        <textarea id="jsonOutput" class="pane-textarea" readonly spellcheck="false"
          data-i18n-ph="outputPh" placeholder="转换结果将显示在这里"></textarea>
      </div>
    </section>

    <footer class="foot">
      <p data-i18n="footPrivacy">🔒 所有解析与转换均在本地浏览器中完成，文件不会上传到任何服务器。</p>
      <p>
        <span data-i18n="footCredit1">功能对标 FeHelper「Excel/CSV 转 JSON」</span>
        （<a href="https://github.com/zxlie/FeHelper" target="_blank" rel="noopener">MIT</a>）；
        <span data-i18n="footCredit2">Excel 解析使用 SheetJS</span>（Apache-2.0）。
        <a href="THIRD-PARTY-NOTICES.txt" target="_blank" rel="noopener" data-i18n="footNotices">第三方版权声明</a>
      </p>
    </footer>
  </main>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
