# mimeType -> 文件后缀（不带点）。
# 供 com.alianga.jkit.io.FileType.getSuffixByMimeType 使用。
# 迁移自 ZmlTools src/main/resources/filetype.properties。
# 注意：后缀一律不带前导点，调用方按 "." + suffix 拼接文件名。
image/jpg=jpg
image/bmp=bmp
image/gif=gif
image/png=png
image/x-png=png
image/vnd.mozilla.apng=png
image/jpeg=jpeg
image/vnd.wap.wbmp=wbmp
image/x-icon=ico
image/svg+xml=svg
image/webp=webp
application/x-photoshop=psd
image/vnd.adobe.photoshop=psd
image/psd=psd
image/tiff=tiff
image/vnd.dwg=dwg
